name: Deploy

# On every merge to main that changes the app or the playbooks:
# test -> build image -> scan -> push to ECR -> upload playbooks ->
# roll out with Ansible through Systems Manager -> smoke test.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "ansible/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: attendance-app
  ARTIFACTS_BUCKET: attendance-artifacts-428032596088-ap-southeast-2

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    name: Build and deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to AWS (least-privilege deploy user)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./app

      - name: Scan image (Trivy, report only)
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.0 image --severity HIGH,CRITICAL --exit-code 0 "$IMAGE:latest"

      - name: Push image (commit SHA tag for rollback, latest for deploy)
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Upload Ansible playbooks to S3
        run: aws s3 sync ansible/ "s3://${ARTIFACTS_BUCKET}/ansible/" --delete

      - name: Roll out with Ansible through Systems Manager
        run: |
          CMD_ID=$(aws ssm send-command \
            --document-name attendance-apply-ansible \
            --targets "Key=tag:Role,Values=app" \
            --parameters "BucketName=${ARTIFACTS_BUCKET},Region=${AWS_REGION},ImageTag=latest" \
            --max-concurrency 1 --max-errors 0 \
            --query "Command.CommandId" --output text)
          echo "Command ID: $CMD_ID"

          STATUSES=""
          for i in $(seq 1 90); do
            STATUSES=$(aws ssm list-command-invocations --command-id "$CMD_ID" \
              --query "CommandInvocations[].Status" --output text)
            echo "Server statuses: ${STATUSES:-none yet}"
            if [ -n "$STATUSES" ] && ! echo "$STATUSES" | grep -qE "Pending|InProgress|Delayed"; then
              break
            fi
            sleep 10
          done

          if [ -z "$STATUSES" ]; then
            echo "No servers received the command. Is the stack running?"
            exit 1
          fi
          if echo "$STATUSES" | tr '\t' '\n' | grep -qv '^Success$'; then
            echo "Deployment failed on at least one server."
            exit 1
          fi

      - name: Smoke test through the load balancer
        run: |
          ALB=$(aws elbv2 describe-load-balancers --names attendance-alb \
            --query "LoadBalancers[0].DNSName" --output text)
          echo "Testing http://$ALB/health"
          for i in $(seq 1 18); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://$ALB/health" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "### Deployed commit ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
              echo "App: http://$ALB" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test failed"
          exit 1
